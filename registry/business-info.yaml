      pageNum:
        type: int
        flag: page
        default: 1
        min: 1
        desc: 页码
      pageSize:
        type: int
        flag: limit
        default: 20
        min: 1
        max: 20
        desc: 每页条数（平台上限 20）
    resolve: *resolve-enterprise
