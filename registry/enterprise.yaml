# 企业（enterprise）
#
# 两条命令：
#   enterprise search <关键词>   模糊搜企业，拿信用代码
#   enterprise risk   <代码或全名>  并发扇出 17 项风险检查，默认只列命中
#
# 实测记录（与文档不一致处，一律以实测为准）：
#   - enterprise/search 的企业名字段是 companyName，文档写的 name 是错的
#   - pageSize 上限 10，超过静默降级为 10 —— 所以这里 max 设 10，超限报错拦下
#   - 搜索结果前排大量是无 creditCode 的注销企业，故默认过滤，--all 放开
#   - wy-enterprise 只认精确全名或有效代码，模糊名报 2500005
#   - 行政处罚 v2 未开通（2201007），故不收录

module: enterprise

endpoints:
  # ——————————————————————————————————————————————————————————
  - noun: enterprise
    verb: search
    path: /openapi/enterprise/search
    summary: 按名称模糊搜企业，拿到统一社会信用代码
    params:
      keyword:
        required: true
        positional: true
        multi: true
        send_as: companyName   # 平台叫 companyName，但它是关键词，与返回行的同名字段会打架
        desc: 企业名称关键词
      pageNum:
        type: int
        flag: page
        default: 1
        min: 1
        desc: 页码
      pageSize:
        type: int
        flag: limit
        default: 10
        min: 1
        max: 10
        desc: 每页条数（平台硬上限 10）
    result:
      list: data.list
      coordinate: [keyword]
      default_fields:
        [companyName, creditCode, status, operName, industryName, registCapi, startDate]
      meta: [totalCount, pageNum, pageSize]
      # 没有信用代码的注销/吊销企业对下一步毫无用处，默认不出
      filter:
        creditCode: { present: true }
        status: [存续, 在业, 迁出]

  # ——————————————————————————————————————————————————————————
  - noun: enterprise
    verb: risk
    summary: 企业风险体检——并发查 17 项名单，默认只列命中项
    params:
      target:
        required: true
        positional: true
        multi: true
        desc: 统一社会信用代码，或企业全名（必须精确）
      history:
        type: bool
        default: false
        desc: 查历史数据而非当前在册（7 个接口支持）
      sanctionType:
        type: int
        flag: sanction-type
        default: 1
        min: 1
        max: 3
        desc: 制裁清单档位 1-制裁名单 2-出口管制 3-不可靠实体
    # 先归一化：15 个接口要代码，2 个要企业名，用户通常只有其一
    resolve:
      path: /openapi/enterprise/wy-enterprise
      try_params:
        - { creditCode: target }    # 先当代码试
        - { companyName: target }   # 再当全名试
      list: data
      bind:
        creditCode: socialCreditCode
        companyName: companyName
      hint: 企业名必须是精确全名；用 zzapi enterprise search <关键词> 找到准确名称或信用代码
    fanout:
      tag_category: category
      tag_label: riskType
      # 空壳指数是「人人有分」的推断评分，不是事实记录。放 meta 当背景，
      # 不进 items——否则会永远算 1 项命中，且让人分不清事实与平台判断。
      # 实测量表：<20 低风险 / 20-40 中低 / 40+ 中风险
      context:
        - path: /openapi/enterprise/emptyshell_risk
          params: { creditCode: socialCreditCode }
          item: data
          as:
            riskScore: shellRiskScore
            scoreLevel: shellRiskLevel
        # 关联方风险计数：不是本企业的记录，38 项体检一条都看不到。
        # 「本企业干净，但关联着 4 家失信企业」是准入判断的关键信息。
        - path: /openapi/enterprise/wy-enterprise
          params: { creditCode: socialCreditCode }
          item: data
          as:
            relationPromiseNum: relatedDishonestCount
            relationExecutorsNum: relatedExecutedCount
      targets:
        # —— 司法 ——
        - category: 司法
          label: 失信被执行人
          path: /openapi/enterprise/risk/sxbzx
          params: { socialCreditCode: socialCreditCode }
          default_fields: [caseCode, lawEnforcementUnit, actsOfBreachOfTrust, performance, publishDate, regDate]

        # —— 采购 ——
        - category: 采购
          label: 央企供应商不良行为
          path: /openapi/enterprise/risk/yqgysblxw
          params: { socialCreditCode: socialCreditCode }
          default_fields: [source, actsOfBreachOfTrust, punishmentResult, jrhmd, jchmd, link]
        - category: 采购
          label: 政府采购违法失信
          path: /openapi/enterprise/risk/zfcgwfsx
          params: { socialCreditCode: socialCreditCode }
          default_fields: [actsOfBreachOfTrust, punishmentResult, lawEnforcementUnit, dateOfPunishment, basisOfPunishment]
        - category: 采购
          label: 军队采购失信
          path: /openapi/enterprise/risk/jdcgsx
          params: { socialCreditCode: socialCreditCode }
          default_fields: [actsOfBreachOfTrust, punishmentResult, lawEnforcementUnit, dateOfPunishment]
        - category: 采购
          label: 军队暂停资格
          path: /openapi/enterprise/risk/jdztzg
          params: { socialCreditCode: socialCreditCode }
          default_fields: [actsOfBreachOfTrust, punishmentResult, lawEnforcementUnit, dateOfPunishment]

        # —— 工商 ——
        - category: 工商
          label: 严重违法失信企业
          path: /openapi/enterprise/risk/yzwfsx
          params: { socialCreditCode: socialCreditCode }
          default_fields: [actsOfBreachOfTrust, lawEnforcementUnit, dateOfPunishment, source]
        - category: 工商
          label: 空壳公司
          path: /openapi/enterprise/risk/kkqy
          params: { socialCreditCode: socialCreditCode }
          default_fields: [companyName, socialCreditCode]
        - category: 工商
          label: 假冒国企
          path: /openapi/enterprise/risk/counterfeitStateIndustryName
          params: { socialCreditCode: socialCreditCode }
          default_fields: [counterfeitName, publishDate]

        # —— 税务 ——
        - category: 税务
          label: 重大税收违法失信
          path: /openapi/enterprise/risk/zdsswfsx
          params: { socialCreditCode: socialCreditCode }
          default_fields: [natureOfTheCase, illegalSituation, releaseAuthority, checkUnit, releaseDate]

        # —— 安全 ——
        - category: 安全
          label: 事故责任企业名录
          path: /openapi/enterprise/risk/aqscglzs
          params: { socialCreditCode: socialCreditCode, isHistory: history }
          default_fields: [unitType, projectName, accidentResponsibilityDesc, accidentTime, deathCount, accidentLocation, publicTime]
        - category: 安全
          label: 安全生产严重失信
          path: /openapi/enterprise/risk/aqscsx
          params: { socialCreditCode: socialCreditCode, isHistory: history }
          default_fields: [organ, jrhmd, jchmd, address, dataSource, publishTime]

        # —— 医药 ——
        - category: 医药
          label: 价格招采失信医药企业
          path: /openapi/enterprise/risk/sxyyqymd
          params: { socialCreditCode: socialCreditCode, isHistory: history }
          default_fields: [ratingProvince, currentRating, previousRating, dishonestReason, invalidStartDate, possibleRemoveTime]
        - category: 医药
          label: 药品联采违规名单
          path: /openapi/enterprise/risk/gjzzyplhcgwgmd
          params: { socialCreditCode: socialCreditCode, isHistory: history }
          default_fields: [violationReason, measures, includedViolationDate, suspendedCentralizedPurchaseQualificationEndDate]
        - category: 医药
          label: 欺诈骗保
          path: /openapi/enterprise/risk/ylbzj
          params: { socialCreditCode: socialCreditCode, isHistory: history }
          default_fields: [title, content, batch, jrhmd, publishTime, url]

        # —— 劳动 ——
        - category: 劳动
          label: 拖欠农民工工资
          path: /openapi/enterprise/risk/tqnmggz
          params: { socialCreditCode: socialCreditCode, isHistory: history }
          default_fields: [title, reason, details, organ, instrument, jrhmd, jchmd, province]

        # —— 制裁 ——
        - category: 制裁
          label: 制裁与反制裁清单
          path: /openapi/enterprise/risk/zcqd
          params: { companyName: companyName, govSanctionDataType: sanctionType, isHistory: history }
          default_fields: [country, summary, issuer, issueDate, suspendEndDate, dataType]

        # —— 组织 ——
        - category: 组织
          label: 涉嫌非法社会组织
          path: /openapi/enterprise/risk/ffshzzgs
          params: { companyName: companyName }
          default_fields: [companyName, url]

        # ——— 以下来自 enterprise-business-risk 模块 ———
        # 该模块每个主题有 base / _list / _history 三个变体，实测
        # base = 全集、_list ≡ isHistory:0、_history ≡ isHistory:1，
        # 故一律用 base，历史与否交给 --history。

        # —— 工商 ——
        - category: 工商
          label: 经营异常名录
          path: /openapi/enterprise/abnormal
          list: data.list
          params: { creditCode: socialCreditCode, isHistory: history }
          default_fields: [inReason, inDate, department, outReason, outDate, outDepartment, province]
        - category: 工商
          label: 严重违法（工商公示）
          path: /openapi/enterprise/serious_illegal
          list: data.list
          params: { creditCode: socialCreditCode, isHistory: history }
          default_fields: [illType, inReason, inDate, inDepartment, outReason, outDate, outDepartment]
          note: 与「严重违法失信企业」为同一名录的另一条数据管线，字段更全；两者可能同时命中同一件事

        # —— 处罚 ——
        - category: 处罚
          label: 行政处罚
          path: /openapi/enterprise/administrative_punishment
          list: data.list
          params: { creditCode: socialCreditCode, isHistory: history }
          default_fields: [number, illegalType, content, punishmentText, department, date, basedOn]
        - category: 处罚
          label: 环保处罚
          path: /openapi/enterprise/huanbaochufas
          list: data.list
          params: { creditCode: socialCreditCode, isHistory: history }
          default_fields: [documentNo, illegalType, punishmentType, punishmentResult, punishmentDept, punishmentDate, province]

        # —— 税务 ——
        - category: 税务
          label: 非正常户
          path: /openapi/enterprise/abnormal_enterprises
          list: data.list
          params: { creditCode: socialCreditCode, isHistory: history }
          default_fields: [reason, state, judgeDate, judgeDepartment, overdueType, overdueAmount, area]
        - category: 税务
          label: 重大税收违法（工商公示）
          path: /openapi/enterprise/huge_tax_punishment
          list: data.list
          params: { creditCode: socialCreditCode, isHistory: history }
          default_fields: [caseType, truth, lawPunishment, checkDepartment, pubDepartment, time, area]
          note: 与「重大税收违法失信」为同一事项的另一条数据管线，字段更全；两者可能同时命中
        - category: 税务
          label: 欠税公告
          path: /openapi/enterprise/overduetaxs
          list: data.list
          params: { creditCode: socialCreditCode, isHistory: history }
          default_fields: [overdueType, overdueAmount, currOverdueAmount, taxBureau, pubDepartment, pubDate, area]

        # —— 司法 ——
        - category: 司法
          label: 股权冻结
          path: /openapi/enterprise/judicial_freezes
          list: data.list
          params: { creditCode: socialCreditCode, isHistory: history }
          default_fields: [beExecutedPerson, status, type, amount, executiveCourt, detailFreezeStartDate, detailFreezeEndDate, loseEfficacyReason, loseEfficacyDate]
          note: 先看 beExecutedPerson 是不是本企业（可能是母公司），再看 status 是否已解除
        - category: 司法
          label: 终本案件
          path: /openapi/enterprise/terminationcaseitem
          list: data.list
          params: { creditCode: socialCreditCode, isHistory: history }
          default_fields: [name, court, caseNoTerminal, caseNoOrigin, filingDate, terminateDate, amount, failPerformAmount]
          note: 先看 name 是不是本企业（可能是关联公司）

        # —— 司法（来自 enterprise-judicial-risk，只收稀疏强信号）——
        # 开庭公告/案件/诉讼角色不在此列：实测 8 家合计 646/473/339 条，
        # 家家都有、动辄上百，属常态数据而非风险命中，塞进「只列命中」的
        # 扇出会把真信号淹没。它们走 enterprise lawsuit 的摘要视图。
        - category: 司法
          label: 被执行人
          path: /openapi/enterprise/executedpersons
          list: data.list
          params: { creditCode: socialCreditCode, isHistory: history }
          default_fields: [caseNumber, court, amount, caseDate, status]
          note: 被执行人 ≠ 失信被执行人；有执行案件不等于拒不履行。先看 name 是否本企业
        - category: 司法
          label: 执行案件
          path: /openapi/enterprise/executions
          list: data.list
          params: { creditCode: socialCreditCode, isHistory: history }
          default_fields: [caseNumber, court, amount, caseDate, status]
        - category: 司法
          label: 限制高消费
          path: /openapi/enterprise/restricted_consumer
          list: data.list
          params: { creditCode: socialCreditCode, isHistory: history }
          default_fields: [caseNo, court, applicant, publishDate, restrictedPerson]
        - category: 司法
          label: 破产重整
          path: /openapi/enterprise/t_bankruptcy_new
          list: data.list
          params: { creditCode: socialCreditCode }
          default_fields: [caseNo, court, applicant, respondent, publishDate, caseType]
        - category: 司法
          label: 司法拍卖
          path: /openapi/enterprise/auctions_relations
          list: data.list
          params: { creditCode: socialCreditCode }
          default_fields: [title, court, startTime, endTime, initialPrice, status]
        - category: 处罚
          label: 违法建设
          path: /openapi/enterprise/t_illegal_construction
          list: data.list
          params: { creditCode: socialCreditCode }
          default_fields: [projectName, illegalContent, punishResult, department, punishDate]
        - category: 司法
          label: 询价评估
          path: /openapi/enterprise/t_inquiry_evaluation
          list: data.list
          params: { creditCode: socialCreditCode }
          default_fields: [caseNo, court, targetName, evaluationResult, publishDate]

        # —— 担保（自愿融资担保，不必然是负面，但需看主体）——
        - category: 担保
          label: 股权出质
          path: /openapi/enterprise/equityquality
          list: data.list
          params: { creditCode: socialCreditCode, isHistory: history }
          default_fields: [pledgor, pawnee, objectCompany, pledgorAmount, pledgorUnit, status, date, publicDate, cancelDate]
          note: pledgor 是出质方、pawnee 是质权人。本企业若为 pawnee 则是债权人，不是风险；还要看 status 是否已失效
        - category: 担保
          label: 知识产权出质
          path: /openapi/enterprise/knowledge_properties
          list: data.list
          params: { creditCode: socialCreditCode, isHistory: history }
          default_fields: [name, type, pledgor, pawnee, period, status, publicDate]
          note: pledgor 是出质方。本企业若为 pledgor，说明以知识产权质押融资
        - category: 担保
          label: 动产抵押
          path: /openapi/enterprise/mortgages
          list: data.list
          params: { creditCode: socialCreditCode, isHistory: history }
          default_fields: [number, amount, status, publicDate, regDate, department, mortgagees, guarantees]
          note: mortgagees 是抵押权人（债权方）。本企业若在其中则是债权人，不是风险

        # —— 存续（企业是否在正常经营）——
        - category: 存续
          label: 注销公告
          path: /openapi/enterprise/logoutannouncement
          list: data.list
          params: { creditCode: socialCreditCode }
          default_fields: [logoutReason, belongOrg, auditRegDate, creditorStartDate, creditorEndDate, auditLeader, cancelDate]
          note: 命中意味着企业正在走注销/解散流程——对供应商准入通常是硬否决项
        - category: 存续
          label: 清算组备案
          path: /openapi/enterprise/clear_account
          list: data.list
          params: { creditCode: socialCreditCode }
          default_fields: [clearType, leader, employees]
          note: 已成立清算组，通常与注销/解散同时出现

  # ——————————————————————————————————————————————————————————
  - noun: enterprise
    verb: cert
    path: /openapi/enterprise/supplier-hierarchical-certificate
    summary: 查供应商分级认证证书（有无认证 / 等级 / 有效期）
    params:
      target:
        required: true
        positional: true
        multi: true
        desc: 统一社会信用代码，或企业全名（必须精确）
    # 和 risk 一样：用户给什么都行，内部归一化成信用代码
    resolve:
      path: /openapi/enterprise/wy-enterprise
      try_params:
        - { creditCode: target }
        - { companyName: target }
      list: data
      bind:
        creditCode: socialCreditCode
        companyName: companyName
      hint: 企业名必须是精确全名；用 zzapi enterprise search <关键词> 找到准确名称或信用代码
    # 这个接口把统一社会信用代码叫 companyUniCode——同一样东西的第三种命名
    # （另两种是 socialCreditCode、creditCode），靠映射吃掉，不必改代码
    send:
      companyUniCode: socialCreditCode
    result:
      list: data
      coordinate: [socialCreditCode, companyName, target]
      default_fields:
        [certified, companyApplyStandard, appraiseDate, expiryDate, certCode, certLevel, certificateUrl, failMessage]
      transforms:
        # 恒返回 1 条：appraiseResult 0/1 才是答案，未认证时其余字段全为 null
        - path: appraiseResult
          as: certified
          map:
            "1": 已认证
            "0": 未认证

  # ——————————————————————————————————————————————————————————
  - noun: enterprise
    verb: info
    path: /openapi/enterprise/wy-enterprise
    summary: 工商基本信息（含关联失信/被执行数）
    params:
      target:
        required: true
        positional: true
        multi: true
        desc: 统一社会信用代码，或企业全名（必须精确）
    resolve:
      path: /openapi/enterprise/wy-enterprise
      try_params:
        - { creditCode: target }
        - { companyName: target }
      list: data
      bind:
        creditCode: socialCreditCode
        companyName: companyName
      hint: 企业名必须是精确全名；用 zzapi enterprise search <关键词> 找到准确名称或信用代码
    send:
      creditCode: socialCreditCode
    result:
      # wy-enterprise 的 data 是单对象不是数组，用 item
      item: data
      coordinate: [socialCreditCode, companyName, target]
      # relationPromiseNum/relationExecutorsNum 是关联方风险计数，
      # 31 项体检看不到——它们不是本企业的记录，而是关联企业的
      default_fields:
        [companyName, creditCode, status, operName, title, econKind, registCapi, actualCapi,
         startDate, checkDate, belongOrg, industryName, address, contactNumber, contactEmail,
         relationPromiseNum, relationExecutorsNum, scope]
