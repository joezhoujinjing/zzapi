  # —— 食品：生产许可 / 经营许可 / 添加剂 / 农产品认证 / 出口备案 ——
  - noun: ip
    verb: food
    summary: 食品类许可（食品生产许可证 SC/食品经营许可证/食品添加剂生产许可/食品农产品认证/出口食品生产企业备案），--only 生产,经营,认证
    params:
      target:
        required: true
        positional: true
        multi: true
        desc: 统一社会信用代码，或企业全名（必须精确）
      history:
        type: bool
        default: false
        desc: 查历史证书而非当前在册
    resolve:
      path: /openapi/enterprise/wy-enterprise
      try_params:
        - { creditCode: target }
        - { companyName: target }
      list: data
      bind:
        creditCode: socialCreditCode
        companyName: companyName
      hint: 企业名必须是精确全名；用 zzapi enterprise search <关键词> 找到准确名称或信用代码
    fanout:
      tag_category: category
      tag_label: certType
      targets:
        # default_fields 取证书名/许可证编号/食品类别/到期/状态/发证机关 —— SC 证是食品供应商准入硬门槛
        # 文档只有 food_product_license_list / _history；base 路径已实调存在
        - category: 生产
          label: 食品生产许可证
          path: /openapi/enterprise/food_product_license
          list: data.list
          params: { creditCode: socialCreditCode, isHistory: history }
          default_fields: [licenseName, registerNo, proType, validEnd, state, department]
        # default_fields 取证书名/编号/产品类别/到期/状态/发证机关
        # 文档只有 food_additives_list / _history；base 路径已实调存在
        - category: 生产
          label: 食品添加剂生产许可证
          path: /openapi/enterprise/food_additives
          list: data.list
          params: { creditCode: socialCreditCode, isHistory: history }
          default_fields: [licenseName, registerNo, product, validEnd, state, issueUnit]
        # default_fields 取证书名/编号/主体业态/经营项目/到期/状态
        - category: 经营
          label: 食品经营许可证
          path: /openapi/enterprise/food_business_license_list
          list: data.list
          params: { creditCode: socialCreditCode, isHistory: history }
          default_fields: [licenseName, registerNo, identity, operationItem, validEnd, state]
        # default_fields 取证书名/编号/认证项目/产品名/到期/状态 —— 有机/绿色/GAP 等认证
        - category: 认证
          label: 食品农产品认证
          path: /openapi/foodLicense/list
          list: data.list
          params: { creditCode: socialCreditCode, isHistory: history }
          default_fields: [licenseName, registerNo, renzhengItem, productName, validEnd, state]
        # default_fields 取证书名/备案号/产品名/国家地区/到期/状态
        - category: 认证
          label: 出口食品生产企业备案
          path: /openapi/foodProductEnt/list
          list: data.list
          params: { creditCode: socialCreditCode, isHistory: history }
          default_fields: [licenseName, registerNo, productName, country, validEnd, state]

