# 知识产权与资质证书（ip）
#
# 平台把「知识产权」分组塞了 85 个接口，其中真正的知产只有 5 个（专利/商标/著作权/域名），
# 其余 80 个全是各行业的资质许可与认证。招采里它们是一回事：供应商技术实力佐证与
# 资质加分项核验——「有多少专利、是不是高新、有没有 ISO、建筑资质几级、药品许可在不在」。
#
# 命令树（17 条，覆盖 84 个平台端点 + 复用 1 个地产组端点；医药广告 1 个端点平台侧不存在）：
#   单接口（可翻页、带 totalCount——数量类问题看 meta.totalCount）：
#     ip patent / trademark / trademark-detail / copyright / domain   知产四件套
#     ip cert       资质证书总表（全类型一张表，先看这里）
#     ip hightech   高新技术企业
#     ip personnel  工程类专业人员资质（建造师等，按人一行，数量大）
#   扇出（一个命令并发查一个行业的全部许可/认证，默认只列命中，--only 按分类缩小）：
#     ip system / product / it / telecom / construction / env / medical / food / business
#
# 实测记录（2026-08-20，深圳市腾讯计算机系统有限公司 / 中国建筑第八工程局有限公司）：
#   - 三个端点家族全部返回 data.list + totalCount/pageNum/pageSize，都认 pageSize（上限 20）
#   - 文档只给 xxx_list / xxx_history 两个端点的，去掉后缀的 base 路径存在且认 isHistory
#     （trademark_info / domains_alls / certificate_main / hightech_enterprises /
#      building_engineering / financial / food_additives / food_product_license /
#      telecom_licence 九个全部实调通过）
#   - 全部 17 条命令都对真实企业跑过一遍，所有扇出目标 failed=0，唯一不存在的端点是
#     医药类广告资质（1601013），已注释掉，见 ip medical
#   - /openapi/<camel>/list 与 /openapi/enterprise/xxx_list 家族同样认 isHistory：
#     0 = 在册，1 = 历史，不传 = 全量（managementSystem/list 实测 9 / 33 / 42）
#   - trademark_detail 必须带企业 zzEid（wy-enterprise 的 id 字段），只给 regNumber 报 1001003
#   - 所有接口都收 creditCode 或 companyName，但 companyName 须精确全名，
#     故统一走 resolve 归一化，用户给代码或全名都行
#
# 字段取舍总则：知产不是核心尽调项，默认字段极简——名称 / 编号 / 日期 / 状态，
# 外加一个能回答「是什么等级/范围」的字段；来源网址、内部 id、代理机构一律 --full。

module: ip

endpoints:
  # ══════════════════════════════════════════════════════════════
  # 知产四件套
  # ══════════════════════════════════════════════════════════════

  # default_fields 取专利名/类型/申请号/申请日/授权日/法律状态 —— 回答「有没有、是发明还是实用新型、授权了没」；数量看 meta.totalCount
  - noun: ip
    verb: patent
    path: /openapi/enterprise/patents_info
    summary: 专利列表（发明/实用新型/外观设计），数量看 meta.totalCount
    params:
      target:
        required: true
        positional: true
        multi: true
        desc: 统一社会信用代码，或企业全名（必须精确）
      type:
        desc: 专利类型 fmzl-发明 syxx-实用新型 wgsj-外观设计（不传=全部）
      history:
        type: bool
        default: false
        desc: 查历史专利（已失效/转让）而非当前在册
      page:
        type: int
        default: 1
        min: 1
        desc: 页码
      limit:
        type: int
        default: 20
        min: 1
        max: 20
        desc: 每页条数（平台上限 20）
    resolve:
      path: /openapi/enterprise/wy-enterprise
      try_params:
        - { creditCode: target }
        - { companyName: target }
      list: data
      bind:
        creditCode: socialCreditCode
        companyName: companyName
      hint: 企业名必须是精确全名；用 zzapi enterprise search <关键词> 找到准确名称或信用代码
    send:
      creditCode: socialCreditCode
      type: type
      isHistory: history
      pageNum: page
      pageSize: limit
    result:
      list: data.list
      coordinate: [socialCreditCode, companyName, target]
      default_fields: [patentName, typeName, requestNumStandard, requestDate, authorizeDate, lastStatus]
      meta: [totalCount, pageNum, pageSize]

  # default_fields 取商标名/注册号/国际分类/申请日/状态/专用权到期 —— 回答「有没有注册商标、还有效吗、第几类」
  - noun: ip
    verb: trademark
    path: /openapi/enterprise/trademark_info
    summary: 商标列表（名称/国际分类/状态/专用权期限），数量看 meta.totalCount
    params:
      target:
        required: true
        positional: true
        multi: true
        desc: 统一社会信用代码，或企业全名（必须精确）
      history:
        type: bool
        default: false
        desc: 查历史商标而非当前在册
      page:
        type: int
        default: 1
        min: 1
        desc: 页码
      limit:
        type: int
        default: 20
        min: 1
        max: 20
        desc: 每页条数（平台上限 20）
    resolve:
      path: /openapi/enterprise/wy-enterprise
      try_params:
        - { creditCode: target }
        - { companyName: target }
      list: data
      bind:
        creditCode: socialCreditCode
        companyName: companyName
      hint: 企业名必须是精确全名；用 zzapi enterprise search <关键词> 找到准确名称或信用代码
    send:
      creditCode: socialCreditCode
      isHistory: history
      pageNum: page
      pageSize: limit
    result:
      list: data.list
      coordinate: [socialCreditCode, companyName, target]
      default_fields: [trademarkName, regNumber, typeNum, applyDate, trademarkStatus, endDate]
      meta: [totalCount, pageNum, pageSize]

  # default_fields 取商标名/分类/申请日/状态/专用权期限 + 流程与公告 —— 详情的价值就在 steps/notices（驳回、无效、异议都在里面）
  # 单独成条的理由：输入是注册号而非企业，与列表的参数结构不同，无法用 variants 折叠
  - noun: ip
    verb: trademark-detail
    path: /openapi/enterprise/trademark_detail
    summary: 单个商标详情（流程节点/公告/商品服务），注册号来自 ip trademark 的 regNumber
    params:
      target:
        required: true
        positional: true
        desc: 统一社会信用代码，或企业全名（必须精确）——接口要企业 ID 配合注册号
      regNumber:
        required: true
        positional: true
        multi: true
        desc: 商标申请/注册号（ip trademark 输出的 regNumber）
    # 接口要的 zzEid 是平台内部企业 ID，wy-enterprise 的 id 字段就是它
    resolve:
      path: /openapi/enterprise/wy-enterprise
      try_params:
        - { creditCode: target }
        - { companyName: target }
      list: data
      bind:
        id: zzEid
        creditCode: socialCreditCode
        companyName: companyName
      hint: 企业名必须是精确全名；用 zzapi enterprise search <关键词> 找到准确名称或信用代码
    send:
      zzEid: zzEid
      regNumber: regNumber
    result:
      item: data
      coordinate: [socialCreditCode, companyName, target, regNumber]
      default_fields: [trademarkName, typeNum, applyDate, trademarkStatus, period, steps, notices]

  # default_fields 取作品/软件名/类别/登记号/登记日/著作权人/类型 —— 回答「多少软著、登记了什么」；company 可能不是本企业（合作登记）
  - noun: ip
    verb: copyright
    path: /openapi/enterprise/copyrights_relations
    summary: 著作权登记（作品著作权 + 软件著作权），--type S 只看软著；数量看 meta.totalCount
    params:
      target:
        required: true
        positional: true
        multi: true
        desc: 统一社会信用代码，或企业全名（必须精确）
      type:
        desc: P-作品著作权 S-软件著作权（不传=全部）
      page:
        type: int
        default: 1
        min: 1
        desc: 页码
      limit:
        type: int
        default: 20
        min: 1
        max: 20
        desc: 每页条数（平台上限 20）
    resolve:
      path: /openapi/enterprise/wy-enterprise
      try_params:
        - { creditCode: target }
        - { companyName: target }
      list: data
      bind:
        creditCode: socialCreditCode
        companyName: companyName
      hint: 企业名必须是精确全名；用 zzapi enterprise search <关键词> 找到准确名称或信用代码
    send:
      creditCode: socialCreditCode
      type: type
      pageNum: page
      pageSize: limit
    result:
      list: data.list
      coordinate: [socialCreditCode, companyName, target]
      default_fields: [name, type, typeName, number, approvalDate, company]
      meta: [totalCount, pageNum, pageSize]
      transforms:
        - path: type
          map:
            P: 作品著作权
            S: 软件著作权

  # default_fields 取域名/网站名/备案号/备案日/主办单位 —— 回答「官网是哪个、备案在谁名下」
  - noun: ip
    verb: domain
    path: /openapi/enterprise/domains_alls
    summary: 网站域名与 ICP 备案，数量看 meta.totalCount
    params:
      target:
        required: true
        positional: true
        multi: true
        desc: 统一社会信用代码，或企业全名（必须精确）
      history:
        type: bool
        default: false
        desc: 查历史备案而非当前在册
      page:
        type: int
        default: 1
        min: 1
        desc: 页码
      limit:
        type: int
        default: 20
        min: 1
        max: 20
        desc: 每页条数（平台上限 20）
    resolve:
      path: /openapi/enterprise/wy-enterprise
      try_params:
        - { creditCode: target }
        - { companyName: target }
      list: data
      bind:
        creditCode: socialCreditCode
        companyName: companyName
      hint: 企业名必须是精确全名；用 zzapi enterprise search <关键词> 找到准确名称或信用代码
    send:
      creditCode: socialCreditCode
      isHistory: history
      pageNum: page
      pageSize: limit
    result:
      list: data.list
      coordinate: [socialCreditCode, companyName, target]
      default_fields: [domain, siteName, number, checkDate, bodyName]
      meta: [totalCount, pageNum, pageSize]

  # ══════════════════════════════════════════════════════════════
  # 资质总表 / 高新 / 人员
  # ══════════════════════════════════════════════════════════════

  # default_fields 取证书名/编号/发证日/有效期至/状态 —— 总表一行一证，回答「一共有哪些证、哪些快到期」；type 是字典码，靠 licenseName 认
  - noun: ip
    verb: cert
    path: /openapi/enterprise/certificate_main
    summary: 资质证书总表（全部类型一张表，先看这里），数量看 meta.totalCount
    params:
      target:
        required: true
        positional: true
        multi: true
        desc: 统一社会信用代码，或企业全名（必须精确）
      type:
        desc: 证书类别字典码（如 060501 信息安全管理体系）；不传=全部
      state:
        desc: 证书状态码 1-正常 2-注销 3-过期 4-暂停 5-撤销 6-失效 7-未知
      history:
        type: bool
        default: false
        desc: 查历史证书而非当前在册
      page:
        type: int
        default: 1
        min: 1
        desc: 页码
      limit:
        type: int
        default: 20
        min: 1
        max: 20
        desc: 每页条数（平台上限 20）
    resolve:
      path: /openapi/enterprise/wy-enterprise
      try_params:
        - { creditCode: target }
        - { companyName: target }
      list: data
      bind:
        creditCode: socialCreditCode
        companyName: companyName
      hint: 企业名必须是精确全名；用 zzapi enterprise search <关键词> 找到准确名称或信用代码
    send:
      creditCode: socialCreditCode
      type: type
      stateCode: state
      isHistory: history
      pageNum: page
      pageSize: limit
    result:
      list: data.list
      coordinate: [socialCreditCode, companyName, target]
      default_fields: [licenseName, registerNo, validStart, validEnd, state]
      meta: [totalCount, pageNum, pageSize]

  # default_fields 取证书号/年份/级别/有效期起止/状态 —— 回答「是不是高新、国家级还是省级、到期没」
  - noun: ip
    verb: hightech
    path: /openapi/enterprise/hightech_enterprises
    summary: 高新技术企业认定（国家级/省级/市级），--history 看过期批次
    params:
      target:
        required: true
        positional: true
        multi: true
        desc: 统一社会信用代码，或企业全名（必须精确）
      level:
        desc: 级别 01-国家级 02-省级 03-市级 04-县区级（不传=全部）
      state:
        desc: 状态码 1-有效 3-过期 5-撤销 7-未知
      history:
        type: bool
        default: false
        desc: 查历史认定（已过期批次）
      page:
        type: int
        default: 1
        min: 1
        desc: 页码
      limit:
        type: int
        default: 20
        min: 1
        max: 20
        desc: 每页条数（平台上限 20）
    resolve:
      path: /openapi/enterprise/wy-enterprise
      try_params:
        - { creditCode: target }
        - { companyName: target }
      list: data
      bind:
        creditCode: socialCreditCode
        companyName: companyName
      hint: 企业名必须是精确全名；用 zzapi enterprise search <关键词> 找到准确名称或信用代码
    send:
      creditCode: socialCreditCode
      level: level
      stateCode: state
      isHistory: history
      pageNum: page
      pageSize: limit
    result:
      list: data.list
      coordinate: [socialCreditCode, companyName, target]
      default_fields: [registerNo, year, level, validStart, validEnd, state]
      meta: [totalCount, pageNum, pageSize]
      transforms:
        - path: level
          map:
            "01": 国家级
            "02": 省级
            "03": 市级
            "04": 县区级

  # default_fields 取姓名/工种/证书名/证书号/有效期/状态 —— 按人一行；「有多少建造师」看 meta.totalCount（中建八局实测 2513 条）
  # 单独成条而不进 construction 扇出的理由：行数极大，扇出只给一页 20 条且没有 totalCount，回答不了「多少人」
  - noun: ip
    verb: personnel
    path: /openapi/proPerson/list
    summary: 工程类专业人员资质（建造师/安全员等，一人一行），人数看 meta.totalCount
    params:
      target:
        required: true
        positional: true
        multi: true
        desc: 统一社会信用代码，或企业全名（必须精确）
      history:
        type: bool
        default: false
        desc: 查历史记录而非当前在册
      page:
        type: int
        default: 1
        min: 1
        desc: 页码
      limit:
        type: int
        default: 20
        min: 1
        max: 20
        desc: 每页条数（平台上限 20）
    resolve:
      path: /openapi/enterprise/wy-enterprise
      try_params:
        - { creditCode: target }
        - { companyName: target }
      list: data
      bind:
        creditCode: socialCreditCode
        companyName: companyName
      hint: 企业名必须是精确全名；用 zzapi enterprise search <关键词> 找到准确名称或信用代码
    send:
      creditCode: socialCreditCode
      isHistory: history
      pageNum: page
      pageSize: limit
    result:
      list: data.list
      coordinate: [socialCreditCode, companyName, target]
      default_fields: [pname, workType, licenseName, registerNo, validEnd, state]
      meta: [totalCount, pageNum, pageSize]

  # ══════════════════════════════════════════════════════════════
  # 行业扇出：每条命令 = 一个行业的全部许可/认证并发查一遍，默认只列命中
  # 所有扇出共用同一套 params/resolve；目标一律 list: data.list，
  # 发 creditCode + isHistory（默认 0 在册，--history 1 历史）
  # ══════════════════════════════════════════════════════════════

  # —— 体系认证：ISO9001/14001/45001/27001 等 + 服务认证，招采加分项最常问的一组 ——
  - noun: ip
    verb: system
    summary: 管理体系认证（ISO9001/14001/45001/27001…）与服务认证，默认只列在册证书
    params:
      target:
        required: true
        positional: true
        multi: true
        desc: 统一社会信用代码，或企业全名（必须精确）
      history:
        type: bool
        default: false
        desc: 查历史证书（过期/撤销）而非当前在册
    resolve:
      path: /openapi/enterprise/wy-enterprise
      try_params:
        - { creditCode: target }
        - { companyName: target }
      list: data
      bind:
        creditCode: socialCreditCode
        companyName: companyName
      hint: 企业名必须是精确全名；用 zzapi enterprise search <关键词> 找到准确名称或信用代码
    fanout:
      tag_category: category
      tag_label: certType
      targets:
        # default_fields 取证书名/编号/认证依据(ISO 标准号)/发证机构/到期/状态 —— 回答「有哪几个体系、哪家发的、有效吗」
        - category: 体系
          label: 管理体系认证
          path: /openapi/managementSystem/list
          list: data.list
          params: { creditCode: socialCreditCode, isHistory: history }
          default_fields: [licenseName, registerNo, certificationBasis, agencyName, validEnd, state]
          note: state=暂停/过期 的证书不算有效认证；ISO 标准号看 certificationBasis
        # default_fields 取证书名/编号/服务领域/发证机构/到期/状态
        - category: 服务
          label: 服务认证
          path: /openapi/service/list
          list: data.list
          params: { creditCode: socialCreditCode, isHistory: history }
          default_fields: [licenseName, registerNo, serviceScope, agencyName, validEnd, state]

  # —— 产品认证与生产许可：CCC / CESI / 自愿性认证 / 工业产品生产许可 / 特种设备 / 农药 ——
  - noun: ip
    verb: product
    summary: 产品认证与生产许可（CCC/CESI/自愿性认证/IT安全/消防产品/工业产品生产许可/特种设备/农药），--only 强制认证,产品认证,生产许可
    params:
      target:
        required: true
        positional: true
        multi: true
        desc: 统一社会信用代码，或企业全名（必须精确）
      history:
        type: bool
        default: false
        desc: 查历史证书而非当前在册
    resolve:
      path: /openapi/enterprise/wy-enterprise
      try_params:
        - { creditCode: target }
        - { companyName: target }
      list: data
      bind:
        creditCode: socialCreditCode
        companyName: companyName
      hint: 企业名必须是精确全名；用 zzapi enterprise search <关键词> 找到准确名称或信用代码
    fanout:
      tag_category: category
      tag_label: certType
      targets:
        # default_fields 取证书名/编号/产品名/型号/到期/状态 —— 回答「哪些产品有 3C、还有效吗」
        - category: 强制认证
          label: CCC 产品认证
          path: /openapi/ccc/list
          list: data.list
          params: { creditCode: socialCreditCode, isHistory: history }
          default_fields: [licenseName, registerNo, productName, model, validEnd, state]
        # default_fields 取声明编号/产品类别/声明日/到期/状态 —— 自我声明是 3C 的替代路径
        - category: 强制认证
          label: CCC 自我声明
          path: /openapi/enterprise/ccc_self_declaration_list
          list: data.list
          params: { creditCode: socialCreditCode, isHistory: history }
          default_fields: [licenseName, selfDeclarationNo, productType, selfDeclarationDate, endDate, selfDeclarationState]
        # default_fields 取证书名/编号/产品名/型号/到期/状态
        - category: 产品认证
          label: CESI 产品认证
          path: /openapi/enterprise/cesi_certification_list
          list: data.list
          params: { creditCode: socialCreditCode, isHistory: history }
          default_fields: [licenseName, registerNo, productName, model, validEnd, state]
        # default_fields 取证书名/编号/认证项目/产品单元/到期/状态
        - category: 产品认证
          label: 自愿性工业产品认证
          path: /openapi/industryVolunteer/list
          list: data.list
          params: { creditCode: socialCreditCode, isHistory: history }
          default_fields: [licenseName, registerNo, renzhengItem, unitMain, validEnd, state]
        # default_fields 取证书名/编号/产品/申请级别/到期/状态 —— 级别（EAL）是 IT 安全认证的核心
        - category: 产品认证
          label: IT 产品信息安全认证
          path: /openapi/itSafe/list
          list: data.list
