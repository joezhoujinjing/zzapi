# 工商信息（company）—— 「这家公司是谁」
#
# 来源：enterprise-baseinfo 分组 41 份 spec，折叠/取舍后 27 条命令，覆盖 29 个端点（企业档案 /enterprise 由 enterprise info 覆盖，见下）。
# 未收录 11 个（个体户专表 ×10、结构化变更记录 ×1），理由见 tasks-out 简报。
#
# 命名规则（所有 verb 都是名词，不混动词）：
#   - verb = 「返回的是什么」：info / branches / shareholders / people …
#     复数 = 一组记录，单数 = 单对象。不用 get/list/query，不用平台 URL 末段。
#   - 复合名词用连字符：bid-contacts / legal-rep-history / social-org
#   - 平台成对的 `_list` / `_history` → 一条命令 + `--history` 开关
#     （shareholders / people / investments / equity / contacts）
#   - 本身只有历史轨迹、没有「当前」对应物的数据集 → `X-history` 名词
#     （name-history / legal-rep-history / capital-history / address-history），
#     当前值在 `enterprise info` 里；给这类命令再加 --history 开关会变成永远必须打开的开关
#   - 主体类型专表直接用类型名：foundation / lawfirm / social-org / public-institution / hk-company
#
# 入参约定（与 enterprise risk / cert 一致）：
#   位置参数 <target> = 统一社会信用代码 或 企业全名（精确）。内部先用
#   wy-enterprise 归一化成信用代码 + 企业名，两者进 coordinate，--fields 裁不掉。
#   代价是每个实体多一次调用；换来的是 agent 有名字有代码都能直接用，以及每行自带双标识。
#   需要 zzEid 的专表（社会组织/律所/基金会/事业单位/香港公司/英文名/科技资质/社会组织地址）
#   改用 /openapi/enterprise/zz_eid 归一化。
#
# 响应路径约定（沿用 enterprise.yaml 实测结论，未实调处标 TODO）：
#   带 pageNum/pageSize 的 → data.list；不分页多条 → data；单对象 → item: data
#
# 已知 spec 可疑处（按常识处理，标 TODO）：
#   - employees_alls_list 的 name/jobTitle/nameType、history_oper_names 的 pid、
#     migration_enterprise 的 sourceType 都标「必填」，但它们显然是筛选条件 → 按可选处理
#   - employees_alls 无基础路径 spec，只有 _list/_history；按 business-risk 的实测规律
#     （基础路径 = 全集，isHistory 0/1 区分）推断 /openapi/enterprise/employees_alls 存在

module: enterprise-baseinfo

endpoints:
  # ══════════════════════════════════════════════════════════════
  # 主体档案
  # ══════════════════════════════════════════════════════════════

  # 企业工商档案（/openapi/enterprise/enterprise）不在此收录：`enterprise info` 用的是 resolve 本来就要调的
  # wy-enterprise 端点（不引入新端点），给出同一份档案，且多出关联失信/被执行计数。实测比亚迪两端点字段
  # 对比：/enterprise 独有的 10 个字段（industryCode1-4 / industryName1-4 / canbaoNum / registCapiNew）全为 null，
  # 其默认字段是 enterprise info 的子集——无可合并项。

  # default_fields 与 enterprise info 同口径（法人/资本/日期/状态/类型/行业）—— 这是任意类型主体
  # （含社会组织/事业单位/律所）都能查到的精简版；已是企业的优先用 enterprise info，字段更全。
  - noun: company
    verb: overview
    path: /openapi/enterprise/all_enterprise
    summary: 全类型主体基本信息（企业/社会组织/事业单位/律所通用，19 字段精简版）
    params:
      target:
        required: true
        positional: true
        multi: true
        desc: 统一社会信用代码，或主体全名（必须精确）
    resolve:
      path: /openapi/enterprise/wy-enterprise
      try_params:
        - { creditCode: target }
        - { companyName: target }
      list: data
      bind:
        creditCode: socialCreditCode
        companyName: companyName
      hint: 名称必须是精确全名；用 zzapi enterprise search <关键词> 找到准确名称或信用代码
    send:
      creditCode: socialCreditCode
    result:
      item: data   # TODO 待实调验证
      coordinate: [socialCreditCode, companyName, target]
      default_fields: [operName, registCapi, startDate, status, econKind, industryName]

  # default_fields 只取 brief —— 这条命令的全部价值就是那段简介文本；name 在 coordinate
  - noun: company
    verb: profile
    path: /openapi/enterprise/best_brief
    summary: 企业简介（一段文字介绍）
    params:
      target:
        required: true
        positional: true
        multi: true
        desc: 统一社会信用代码，或企业全名（必须精确）
      pageNum:
        type: int
        flag: page
        default: 1
        min: 1
        desc: 页码
      pageSize:
        type: int
        flag: limit
        default: 5
        min: 1
        max: 20
        desc: 每页条数，默认 5（总数看 meta.totalCount；平台上限 20）
    resolve:
      path: /openapi/enterprise/wy-enterprise
      try_params:
        - { creditCode: target }
        - { companyName: target }
      list: data
      bind:
        creditCode: socialCreditCode
        companyName: companyName
      hint: 企业名必须是精确全名；用 zzapi enterprise search <关键词> 找到准确名称或信用代码
    send:
      creditCode: socialCreditCode
      pageNum: pageNum
      pageSize: pageSize
    result:
      list: data.list   # TODO 待实调验证：分页接口按 data.list 取
      coordinate: [socialCreditCode, companyName, target]
      default_fields: [brief]
      meta: [totalCount]

  # default_fields 留空 —— spec 没给响应字段，响应本身就只有 id，原样输出最诚实。
  # 专表命令内部已自动归一化 zzEid，一般不用手动调这条；留着便于排查。
  - noun: company
    verb: id
    path: /openapi/enterprise/zz_eid
    summary: 企业 id（zzEid）——社会组织/律所等专表内部用它关联，一般不需手动查
    params:
      target:
        required: true
        positional: true
        multi: true
        desc: 统一社会信用代码，或企业全名（必须精确）
    resolve:
      path: /openapi/enterprise/wy-enterprise
      try_params:
        - { creditCode: target }
        - { companyName: target }
      list: data
      bind:
        creditCode: socialCreditCode
        companyName: companyName
      hint: 企业名必须是精确全名；用 zzapi enterprise search <关键词> 找到准确名称或信用代码
    send:
      creditCode: socialCreditCode
    result:
      item: data   # TODO 待实调验证：spec 未给响应字段，猜 data = { zzEid }
      coordinate: [socialCreditCode, companyName, target]
      default_fields: []

  # ══════════════════════════════════════════════════════════════
  # 股权 / 人员 / 投资
  # ══════════════════════════════════════════════════════════════

  # default_fields 取股东名/类型/比例/认缴/实缴/起止 —— 穿透看「谁持多少、认缴还是实缴、
  # 什么时候进的」；--history 时 endDate 才有值，所以一并带上（7 个，比上限多 1 是为历史）。
  # 折叠：partners_alls_list(当前) + partners_alls(历史) → 基础路径 + isHistory
  - noun: company
    verb: shareholders
    path: /openapi/enterprise/partners_alls   # TODO 待实调验证：基础路径是否接受 isHistory 0/1（business-risk 模块实测如此）
    summary: 工商公示股东（名称/类型/出资比例/认缴/实缴）；--history 看已退出股东
    params:
      target:
        required: true
        positional: true
        multi: true
        desc: 统一社会信用代码，或企业全名（必须精确）
      history:
        type: bool
        default: false
        desc: 查历史股东（已退出）而非当前在册
      pageNum:
        type: int
        flag: page
        default: 1
        min: 1
        desc: 页码
      pageSize:
        type: int
        flag: limit
        default: 5
        min: 1
        max: 20
        desc: 每页条数，默认 5（总数看 meta.totalCount；平台上限 20）
    resolve:
      path: /openapi/enterprise/wy-enterprise
      try_params:
        - { creditCode: target }
        - { companyName: target }
      list: data
      bind:
        creditCode: socialCreditCode
        companyName: companyName
      hint: 企业名必须是精确全名；用 zzapi enterprise search <关键词> 找到准确名称或信用代码
    send:
      creditCode: socialCreditCode
      isHistory: history
      pageNum: pageNum
      pageSize: pageSize
    result:
      list: data.list   # TODO 待实调验证
      coordinate: [socialCreditCode, companyName, target]
      default_fields: [stockName, stockType, stockPercent, totalShouldCapi, totalRealCapi, startDate, endDate]
      meta: [totalCount]

  # default_fields 取股东名/类型/比例/认缴/实缴/出资日期 —— 与 shareholders 同问题不同数据源
  # （平台清洗过的股比表，可按出资日期筛）；一般先用 shareholders（工商公示原始）。
  - noun: company
    verb: equity
    path: /openapi/enterprise/best_stock_info
    summary: 股比数据（平台清洗版股东出资：比例/认缴/实缴/出资日期，可按出资日期区间筛）；--history 看历史
    params:
      target:
        required: true
        positional: true
        multi: true
        desc: 统一社会信用代码，或企业全名（必须精确）
      history:
        type: bool
        default: false
        desc: 查历史股比而非当前
      conDateStart:
        flag: from
        desc: 出资日期起（YYYY-MM-DD）
      conDateEnd:
        flag: to
        desc: 出资日期止（YYYY-MM-DD）
      pageNum:
        type: int
        flag: page
        default: 1
        min: 1
        desc: 页码
      pageSize:
        type: int
        flag: limit
        default: 5
        min: 1
        max: 20
        desc: 每页条数，默认 5（总数看 meta.totalCount；平台上限 20）
    resolve:
      path: /openapi/enterprise/wy-enterprise
      try_params:
        - { creditCode: target }
        - { companyName: target }
      list: data
      bind:
        creditCode: socialCreditCode
        companyName: companyName
      hint: 企业名必须是精确全名；用 zzapi enterprise search <关键词> 找到准确名称或信用代码
    send:
      creditCode: socialCreditCode
      isHistory: history
      conDateStart: conDateStart
      conDateEnd: conDateEnd
      pageNum: pageNum
      pageSize: pageSize
    result:
      list: data.list   # TODO 待实调验证
      coordinate: [socialCreditCode, companyName, target]
      default_fields: [stockName, stockType, stockPercent, shouldCapi, realCapi, conDate]
      meta: [totalCount]

  # default_fields 取姓名/职位/起止任职时间 —— 「高管是谁、什么时候上的、走了没」；
  # nameType/sex/pid 都是代码或内部 id。
  # 折叠：employees_alls_list + employees_alls_history → 基础路径 + isHistory
  - noun: company
    verb: people
    path: /openapi/enterprise/employees_alls   # TODO 待实调验证：基础路径无 spec，按 _list/_history 规律推断
    summary: 主要人员（董监高：姓名/职位/任职起止）；--history 看已离任人员
    params:
      target:
        required: true
        positional: true
        multi: true
        desc: 统一社会信用代码，或企业全名（必须精确）
      history:
        type: bool
        default: false
        desc: 查历史主要人员（已离任）而非现任
      name:
        desc: 按姓名筛
      jobTitle:
        flag: title
        desc: 按职位筛（如 董事长）
      pageNum:
        type: int
        flag: page
        default: 1
        min: 1
        desc: 页码
      pageSize:
        type: int
        flag: limit
        default: 5
        min: 1
        max: 20
        desc: 每页条数，默认 5（总数看 meta.totalCount；平台上限 20）
    resolve:
      path: /openapi/enterprise/wy-enterprise
      try_params:
        - { creditCode: target }
        - { companyName: target }
      list: data
      bind:
        creditCode: socialCreditCode
        companyName: companyName
      hint: 企业名必须是精确全名；用 zzapi enterprise search <关键词> 找到准确名称或信用代码
    send:
      creditCode: socialCreditCode
      isHistory: history
      name: name
      jobTitle: jobTitle
      pageNum: pageNum
      pageSize: pageSize
    result:
      list: data.list   # TODO 待实调验证
      coordinate: [socialCreditCode, companyName, target]
      default_fields: [name, jobTitle, startDate, endDate]
      meta: [totalCount]

  # default_fields 取被投企业名/信用代码/股比/认缴/状态/成立日期 —— 「对外投了谁、占多少、
  # 那家还活着吗」；被投方注册资本/行业等放 --full。
  - noun: company
    verb: investments
    path: /openapi/enterprise/investments
    summary: 对外投资（被投企业/持股比例/认缴额/被投方状态）；--history 看已退出的投资
    params:
      target:
        required: true
        positional: true
        multi: true
        desc: 统一社会信用代码，或企业全名（必须精确）
      history:
        type: bool
        default: false
        desc: 查历史对外投资（已退出）而非当前
      pageNum:
        type: int
        flag: page
        default: 1
        min: 1
        desc: 页码
      pageSize:
        type: int
        flag: limit
        default: 5
        min: 1
        max: 20
        desc: 每页条数，默认 5（总数看 meta.totalCount；平台上限 20）
    resolve:
      path: /openapi/enterprise/wy-enterprise
      try_params:
        - { creditCode: target }
        - { companyName: target }
      list: data
      bind:
        creditCode: socialCreditCode
        companyName: companyName
      hint: 企业名必须是精确全名；用 zzapi enterprise search <关键词> 找到准确名称或信用代码
    send:
      creditCode: socialCreditCode
      isHistory: history
      pageNum: pageNum
      pageSize: pageSize
    result:
      list: data.list   # TODO 待实调验证
      coordinate: [socialCreditCode, companyName, target]
      default_fields: [investName, investCreditNo, stockPercentage, shouldCapi, investStatus, investStartDate]
      meta: [totalCount]

  # default_fields 取分支名/负责人/登记机关/注册号 —— 「有没有分支机构、在哪登记、谁负责」；
  # subEid 是内部 id。
  - noun: company
    verb: branches
    path: /openapi/enterprise/branches
    summary: 分支机构（名称/负责人/登记机关）
    params:
      target:
        required: true
        positional: true
        multi: true
        desc: 统一社会信用代码，或企业全名（必须精确）
      pageNum:
        type: int
        flag: page
        default: 1
        min: 1
        desc: 页码
      pageSize:
        type: int
        flag: limit
        default: 5
        min: 1
        max: 20
        desc: 每页条数，默认 5（总数看 meta.totalCount；平台上限 20）
    resolve:
      path: /openapi/enterprise/wy-enterprise
      try_params:
        - { creditCode: target }
        - { companyName: target }
      list: data
      bind:
        creditCode: socialCreditCode
        companyName: companyName
      hint: 企业名必须是精确全名；用 zzapi enterprise search <关键词> 找到准确名称或信用代码
    send:
      creditCode: socialCreditCode
      pageNum: pageNum
      pageSize: pageSize
    result:
      list: data.list   # TODO 待实调验证
      coordinate: [socialCreditCode, companyName, target]
      default_fields: [name, operName, belongOrg, regNo]
      meta: [totalCount]

  # ══════════════════════════════════════════════════════════════
  # 变更与历史轨迹
  # ══════════════════════════════════════════════════════════════

  # default_fields 取日期/事项/变更后 —— 「什么时候、改了什么、改成了什么」；type 是字典码。
  # beforeContent/afterContent 都是长文本（高管备案一条就是整份名单），实测 20 条默认输出
  # 7KB 里大头是这两个字段；默认只出变更后，变更前用 --fields beforeContent 或 --full 再看。
  # 平台把日期区间标为必填，这里给宽区间默认值，agent 默认拿到全量，需要再收窄。
  - noun: company
    verb: changes
    path: /openapi/enterprise/change_records
    summary: 工商变更记录（变更事项/变更前后内容/日期），默认全时段，--from/--to 收窄
    params:
      target:
        required: true
        positional: true
        multi: true
        desc: 统一社会信用代码，或企业全名（必须精确）
      changeDateStart:
        flag: from
        default: "1900-01-01"   # TODO 待实调验证：日期格式与是否允许宽区间
        desc: 变更日期起（YYYY-MM-DD）
      changeDateEnd:
        flag: to
        default: "2099-12-31"   # TODO 待实调验证
        desc: 变更日期止（YYYY-MM-DD）
      pageNum:
        type: int
        flag: page
        default: 1
        min: 1
        desc: 页码
      pageSize:
        type: int
        flag: limit
        default: 5
        min: 1
        max: 20
        desc: 每页条数，默认 5（总数看 meta.totalCount；平台上限 20）
    resolve:
      path: /openapi/enterprise/wy-enterprise
      try_params:
        - { creditCode: target }
        - { companyName: target }
      list: data
      bind:
        creditCode: socialCreditCode
        companyName: companyName
      hint: 企业名必须是精确全名；用 zzapi enterprise search <关键词> 找到准确名称或信用代码
    send:
      creditCode: socialCreditCode
      changeDateStart: changeDateStart
      changeDateEnd: changeDateEnd
      pageNum: pageNum
      pageSize: pageSize
    result:
      list: data.list   # TODO 待实调验证
      coordinate: [socialCreditCode, companyName, target]
      default_fields: [changeDate, changeItem, afterContent]
      meta: [totalCount]

  # default_fields 取曾用名/变更时间 —— 「以前叫什么、什么时候改的」；formatName 是清洗副本，
  # isActual/uTags 是内部标记。
  - noun: company
    verb: name-history
    path: /openapi/enterprise/history_names
    summary: 曾用名（历史名称及变更时间）；当前名称看 enterprise info
    params:
      target:
        required: true
        positional: true
        multi: true
        desc: 统一社会信用代码，或企业全名（必须精确）
      pageNum:
        type: int
        flag: page
        default: 1
        min: 1
        desc: 页码
      pageSize:
        type: int
        flag: limit
        default: 5
        min: 1
        max: 20
        desc: 每页条数，默认 5（总数看 meta.totalCount；平台上限 20）
    resolve:
      path: /openapi/enterprise/wy-enterprise
      try_params:
        - { creditCode: target }
        - { companyName: target }
      list: data
      bind:
        creditCode: socialCreditCode
        companyName: companyName
      hint: 企业名必须是精确全名；用 zzapi enterprise search <关键词> 找到准确名称或信用代码
    send:
      creditCode: socialCreditCode
      pageNum: pageNum
      pageSize: pageSize
    result:
      list: data.list   # TODO 待实调验证
      coordinate: [socialCreditCode, companyName, target]
      default_fields: [historyName, date]
      meta: [totalCount]

  # default_fields 取法人姓名/变更日期 —— 「法人换过几次、什么时候」；pid 是内部人员 id。
  # spec 把 pid 标必填，按筛选条件处理为可选。
  - noun: company
    verb: legal-rep-history
    path: /openapi/enterprise/history_oper_names
    summary: 历任法定代表人及变更日期；当前法人看 enterprise info
    params:
      target:
        required: true
        positional: true
        multi: true
        desc: 统一社会信用代码，或企业全名（必须精确）
      pid:
        desc: 按法人 pid 筛（一般不用）   # TODO 待实调验证：spec 标必填，疑为筛选条件
      pageNum:
        type: int
        flag: page
        default: 1
        min: 1
        desc: 页码
      pageSize:
        type: int
        flag: limit
        default: 5
        min: 1
        max: 20
        desc: 每页条数，默认 5（总数看 meta.totalCount；平台上限 20）
    resolve:
      path: /openapi/enterprise/wy-enterprise
      try_params:
        - { creditCode: target }
        - { companyName: target }
      list: data
      bind:
        creditCode: socialCreditCode
        companyName: companyName
      hint: 企业名必须是精确全名；用 zzapi enterprise search <关键词> 找到准确名称或信用代码
    send:
      creditCode: socialCreditCode
      pid: pid
      pageNum: pageNum
      pageSize: pageSize
    result:
      list: data.list   # TODO 待实调验证
      coordinate: [socialCreditCode, companyName, target]
      default_fields: [name, date]
      meta: [totalCount]

