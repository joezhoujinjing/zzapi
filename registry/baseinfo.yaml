  # default_fields 取名称/法人/状态/成立日期/举办单位/经费来源 —— 事业单位的「是谁、谁办的、
  # 靠财政还是自收自支」；证书起止 --full 看。
  - noun: company
    verb: public-institution
    path: /openapi/enterprise/t_public_institution
    summary: 事业单位登记档案（仅事业单位：法人/状态/举办单位/经费来源）
    params:
      target:
        required: true
        positional: true
        multi: true
        desc: 统一社会信用代码，或单位全名（必须精确）
    resolve:
      path: /openapi/enterprise/zz_eid
      try_params:
        - { creditCode: target }
        - { companyName: target }
      list: data
      bind:
        zzEid: zzEid
      hint: 名称必须是精确全名；用 zzapi enterprise search <关键词> 找到准确名称或信用代码
    send:
      zzEid: zzEid
    result:
      list: data   # TODO 待实调验证
      coordinate: [zzEid, target]
      default_fields: [name, operName, status, startDate, approveDepartment, expenditureSource]

  # default_fields 取中文名/状态/成立日期/律师人数/总所分所/注册资金 —— 律所的「多大、
  # 是总所还是分所、还在执业吗」；合伙人/负责人是 JSON 数组，--full 看。
  - noun: company
    verb: lawfirm
    path: /openapi/enterprise/t_lawfirms
    summary: 律师事务所档案（仅律所：状态/成立日期/律师人数/总所分所/注册资金）
    params:
      target:
        required: true
        positional: true
        multi: true
        desc: 统一社会信用代码，或律所全名（必须精确）
    resolve:
      path: /openapi/enterprise/zz_eid
      try_params:
        - { creditCode: target }
        - { companyName: target }
      list: data
      bind:
        zzEid: zzEid
      hint: 名称必须是精确全名；用 zzapi enterprise search <关键词> 找到准确名称或信用代码
    send:
      zzEid: zzEid
    result:
      list: data   # TODO 待实调验证
      coordinate: [zzEid, target]
      default_fields: [lawNameCn, state, issuanceDate, lawyerNo, lawType, apital]

  # default_fields 取中英文名/商业登记证号/状态/成立日期/解散日期 —— 港企没有内地信用代码，
  # BR 号就是它的主体标识；「还在不在」看 hkStatus + dissolutionDate。
  - noun: company
    verb: hk-company
    path: /openapi/enterprise/t_hkcompanys
    summary: 香港公司注册档案（仅港企：中英文名/商业登记证号/状态/成立与解散日期）
    params:
      target:
        required: true
        positional: true
        multi: true
        desc: 公司全名（必须精确）；港企通常没有内地信用代码
    resolve:
      path: /openapi/enterprise/zz_eid
      try_params:
        - { creditCode: target }
        - { companyName: target }
      list: data
      bind:
        zzEid: zzEid
      hint: 名称必须是精确全名；用 zzapi enterprise search <关键词> 找到准确名称
    send:
      zzEid: zzEid
    result:
      list: data   # TODO 待实调验证
      coordinate: [zzEid, target]
      default_fields: [nameCn, nameEn, brNumber, hkStatus, startDate, dissolutionDate]
